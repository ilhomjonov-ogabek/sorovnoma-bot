version: '3.8'

services:

  app:
    build: .
    container_name: card-processing-app
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/card_processing
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: mySecretKey12345mySecretKey12345mySecretKey12345
      JWT_EXPIRATION: 86400000
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:14
    container_name: card-processing-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: card_processing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: card-processing-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: